<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pick A Gift AR</title>
<meta name="description" content="A risograph-style AR gift: pick one of three cards with your finger.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bungee&family=Chewy&family=Pacifico&family=Shrikhand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4eee3; --pink:#ff48b0; --blue:#0078bf; --yellow:#ffe800; --ink:#1f2a6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); overflow:hidden; font-family:"Space Mono",ui-monospace,monospace; color:var(--ink);
    -webkit-user-select:none; user-select:none; touch-action:none; -webkit-touch-callout:none; }
  #c { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; }
  video { position:fixed; left:0; top:0; width:2px; height:2px; opacity:0.01; pointer-events:none; }

  .grain::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.35; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .25 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  #start { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:24px; text-align:center; background:var(--paper); overflow:hidden; }
  .blob { position:absolute; border-radius:50%; mix-blend-mode:multiply; pointer-events:none; }
  .b1 { width:62vmin; height:62vmin; background:var(--pink); left:-14vmin; top:-16vmin; }
  .b2 { width:48vmin; height:48vmin; background:var(--blue); right:-12vmin; bottom:-10vmin; }
  .b3 { width:30vmin; height:30vmin; background:var(--yellow); right:10vmin; top:8vmin; }
  .dots { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.5;
    background:radial-gradient(var(--blue) 1.3px, transparent 1.8px) 0 0/12px 12px;
    -webkit-mask-image:linear-gradient(160deg, transparent 45%, #000 100%); mask-image:linear-gradient(160deg, transparent 45%, #000 100%); }
  #start > *:not(.blob):not(.dots) { position:relative; }
  .cardrow { display:flex; gap:12px; }
  .mini { width:clamp(38px,9vw,54px); aspect-ratio:5/7; background:var(--pink); border-radius:6px; position:relative;
    box-shadow:5px 5px 0 var(--blue); animation:bob 1.6s ease-in-out infinite; }
  .mini::before, .mini::after { content:""; position:absolute; background:var(--yellow); }
  .mini::before { left:42%; width:16%; top:0; bottom:0; } .mini::after { top:40%; height:12%; left:0; right:0; }
  .mini:nth-child(2){ animation-delay:.2s } .mini:nth-child(3){ animation-delay:.4s }
  @keyframes bob { 0%,100%{ transform:translateY(0) rotate(-5deg) } 50%{ transform:translateY(-10px) rotate(5deg) } }
  h1 { margin:0; font-family:"Archivo Black",sans-serif; font-weight:400; font-size:clamp(52px,13vw,120px); line-height:.9;
    letter-spacing:-.02em; color:var(--blue); position:relative; text-transform:uppercase; }
  h1::after { content:attr(data-t); position:absolute; inset:0; color:var(--pink); mix-blend-mode:multiply; transform:translate(.06em,.05em); white-space:pre-line; }
  .lede { margin:0; font-size:clamp(14px,3.6vw,17px); line-height:1.6; max-width:440px; }
  .btn { font-family:"Archivo Black",sans-serif; font-size:clamp(17px,4.4vw,21px); letter-spacing:.04em; text-transform:uppercase; color:var(--ink);
    background:var(--yellow); border:2.5px solid var(--ink); border-radius:999px; padding:14px 30px;
    box-shadow:5px 5px 0 var(--blue); cursor:pointer; touch-action:manipulation; }
  .btn:active { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--blue); }
  .btn:disabled { opacity:.55; }
  .link { background:none; border:none; color:var(--ink); font-family:inherit; font-size:13px; text-decoration:underline; cursor:pointer; }
  #status { font-size:13px; min-height:1.4em; max-width:440px; }
  .note { font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin:0; }

  #hint { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5;
    background:var(--paper); color:var(--ink); border:2px solid var(--ink); border-radius:999px; padding:9px 18px;
    box-shadow:4px 4px 0 var(--pink); font-size:clamp(12px,3.3vw,14px); font-weight:700;
    white-space:nowrap; max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis; transition:opacity .4s; pointer-events:none; }
  #again { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:6; font-size:15px; padding:10px 18px; display:none; }
  .hidden { opacity:0 !important; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="c"></canvas>

<div id="start" class="grain">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="dots"></div>
  <div class="cardrow"><div class="mini"></div><div class="mini"></div><div class="mini"></div></div>
  <h1 data-t="Pick a&#10;Gift">Pick a<br>Gift</h1>
  <p class="lede">Three identical cards. One surprise.<br>Point at a card and <b>hold your finger on it</b> to open it.</p>
  <button class="btn" id="go" disabled>Loading…</button>
  <div id="status">Loading the AR engine…</div>
  <p class="note">Your camera feed never leaves this device</p>
  <button class="link" id="demoLink">Preview without a camera</button>
</div>
<div id="hint" class="hidden"></div>
<button class="btn" id="again">↺ Pick again</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script type="module">
import { FilesetResolver, PoseLandmarker, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const { Engine, Bodies, Body, Composite, Events, Vertices } = Matter;
const qs = new URLSearchParams(location.search);
const DEBUG = qs.has('debug');
let DEMO = qs.has('demo');

// ---------- utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Riso inks + their overprints
const P = {
  paper: '#f4eee3', pink: '#ff48b0', pinkT: '#ffb3d9', blue: '#0078bf', blueT: '#9ccbea',
  yellow: '#ffe800', yellowT: '#fff29a', green: '#00a95c', greenT: '#bfe6cf',
  ink: '#1f2a6b', red: '#ff4a3d', orange: '#ff7a2f', brown: '#6b3048',
};
const INK = P.ink;
const INKS = [P.pink, P.blue, P.yellow];

// ---------- canvas ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const video = document.getElementById('video');
let W = innerWidth, H = innerHeight, DPR = Math.min(2, devicePixelRatio || 1);
function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (engine) buildWalls();
  if (spritesReady) buildCardSprites();
}

// ---------- sprite helpers ----------
const SR = 2;
function grainOut(g, x0, y0, w, h, density = .035) {
  g.save(); g.globalCompositeOperation = 'destination-out';
  const n = w * h * density;
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(0,0,0,${rand(.12, .5)})`; g.fillRect(rand(x0, x0 + w), rand(y0, y0 + h), rand(.4, 1.5), rand(.4, 1.5)); }
  g.restore();
}
function mk(w, h, padF, fn, grain = true) {
  const pad = Math.round(Math.max(w, h) * padF);
  const c = document.createElement('canvas');
  c.width = Math.ceil((w + pad * 2) * SR); c.height = Math.ceil((h + pad * 2) * SR);
  const g = c.getContext('2d'); g.scale(SR, SR); g.translate(pad, pad);
  g.lineJoin = 'round'; g.lineCap = 'round';
  fn(g, w, h);
  if (grain) grainOut(g, -pad, -pad, w + pad * 2, h + pad * 2);
  return { cv: c, w, h, pad, ox: w / 2, oy: h / 2, shape: 'rect' };
}
// flat ink fill (no gloss, no drop shadow)
function stick(g, path, fill) { g.save(); path(); g.fillStyle = fill; g.fill(); g.restore(); }
// misregistered key-line
function ink(g, path, lw = 2.6) { g.save(); g.translate(1.4, 1); path(); g.lineWidth = lw; g.strokeStyle = INK; g.stroke(); g.restore(); }
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
// halftone dots, size ramps along a direction (clip first)
function halftone(g, x0, y0, w, h, col, step, rmax, ramp) {
  g.save(); g.fillStyle = col;
  for (let y = y0; y < y0 + h + step; y += step) for (let x = x0 + ((Math.round((y - y0) / step) % 2) * step / 2); x < x0 + w + step; x += step) {
    const r = rmax * ramp((x - x0) / w, (y - y0) / h); if (r < .25) continue;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.restore();
}
function label(g, text, x, y, { font, size, fill, strokes = [], rot = 0, maxW = 0, skew = 0, off = null }) {
  g.save(); g.translate(x, y); g.rotate(rot); if (skew) g.transform(1, 0, skew, 1, 0, 0);
  g.font = `${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (maxW) { const m = g.measureText(text).width; if (m > maxW) g.scale(maxW / m, maxW / m); }
  if (off) { g.fillStyle = off; g.fillText(text, size * .06, size * .07); }
  for (const [c, lw] of strokes) { g.lineWidth = lw; g.strokeStyle = c; g.strokeText(text, 0, 0); }
  g.fillStyle = fill; g.fillText(text, 0, 0); g.restore();
}
function sprinkles(g, n, pos) {
  for (let i = 0; i < n; i++) {
    const p = pos(i); g.save(); g.translate(p.x, p.y); g.rotate(rand(0, 3.14));
    g.fillStyle = pick([P.pink, P.blue, P.yellow, P.paper]); rr(g, -4, -1.4, 8, 2.8, 1.4); g.fill(); g.restore();
  }
}
function strawberry(g, x, y, r) {
  const Pt = () => { g.beginPath(); g.moveTo(x, y + r); g.bezierCurveTo(x - r * 1.35, y + r * .1, x - r * .9, y - r * .95, x, y - r * .7);
    g.bezierCurveTo(x + r * .9, y - r * .95, x + r * 1.35, y + r * .1, x, y + r); g.closePath(); };
  stick(g, Pt, P.red);
  g.fillStyle = P.yellow;
  for (let i = 0; i < 7; i++) { g.beginPath(); g.ellipse(x + rand(-r * .5, r * .5), y + rand(-r * .3, r * .6), 1.4, 2.2, 0, 0, 7); g.fill(); }
  ink(g, Pt, 2);
  g.fillStyle = P.green;
  for (let i = 0; i < 4; i++) { g.save(); g.translate(x, y - r * .72); g.rotate(-1.2 + i * .8); g.beginPath(); g.ellipse(0, -r * .28, r * .16, r * .34, 0, 0, 7); g.fill(); g.restore(); }
}
function cherry(g, x, y, r) {
  g.strokeStyle = P.green; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x, y - r * .6); g.quadraticCurveTo(x + r * .3, y - r * 1.6, x + r * 1.1, y - r * 1.9); g.stroke();
  const Pt = () => { g.beginPath(); g.arc(x, y, r, 0, 7); };
  stick(g, Pt, P.red);
  g.fillStyle = P.paper; g.beginPath(); g.ellipse(x - r * .35, y - r * .35, r * .2, r * .3, -.6, 0, 7); g.fill();
  ink(g, Pt, 2);
}
function candle(g, x, yb, cw, chh, col) {
  const Pt = () => rr(g, x - cw / 2, yb - chh, cw, chh, 2);
  stick(g, Pt, P.paper);
  g.save(); Pt(); g.clip(); g.strokeStyle = col; g.lineWidth = 3.5;
  for (let i = -3; i < 12; i++) { g.beginPath(); g.moveTo(x - cw, yb - chh + i * 8); g.lineTo(x + cw, yb - chh + i * 8 - 10); g.stroke(); }
  g.restore(); ink(g, Pt, 1.8);
  g.strokeStyle = INK; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x, yb - chh); g.lineTo(x, yb - chh - 5); g.stroke();
  const fy = yb - chh - 13;
  g.fillStyle = P.yellow; g.beginPath(); g.moveTo(x, fy - 12); g.quadraticCurveTo(x + 8, fy + 2, x, fy + 8); g.quadraticCurveTo(x - 8, fy + 2, x, fy - 12); g.fill();
  g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = P.pink; g.beginPath(); g.moveTo(x + 1, fy - 3); g.quadraticCurveTo(x + 5, fy + 4, x + 1, fy + 8); g.quadraticCurveTo(x - 3, fy + 4, x + 1, fy - 3); g.fill(); g.restore();
}

// ---------- CAKE sprites ----------
const FLAVORS = [
  { sponge: P.yellowT, cream: P.paper, frost: P.pinkT, drip: P.pink, wrap: P.blue },
  { sponge: P.brown, cream: P.pinkT, frost: P.brown, drip: P.pink, wrap: P.yellow },
  { sponge: P.pinkT, cream: P.paper, frost: P.paper, drip: P.pink, wrap: P.blueT },
  { sponge: P.yellowT, cream: P.blueT, frost: P.blueT, drip: P.blue, wrap: P.pink },
  { sponge: P.yellow, cream: P.paper, frost: P.yellowT, drip: P.orange, wrap: P.pinkT },
];
const CANDLE_COL = [P.pink, P.blue, P.yellow];
function withCentroid(s, verts) { const c = Vertices.centre(verts); s.shape = 'poly'; s.verts = verts; s.ox = c.x; s.oy = c.y; return s; }
function spongeDots(g, x, y, w, h) { g.fillStyle = 'rgba(31,42,107,.14)'; for (let i = 0; i < w * h / 180; i++) { g.beginPath(); g.arc(rand(x, x + w), rand(y, y + h), rand(1, 2.2), 0, 7); g.fill(); } }

function spriteWedge(f) {
  const w = 200, h = 130, tl = h * .42, e = x => tl * (1 - x / w);
  const verts = [{ x: 0, y: e(0) }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }];
  const s = mk(w, h, .5, g => {
    const Pt = () => { g.beginPath(); g.moveTo(0, e(0)); g.lineTo(w, 0); g.lineTo(w, h); g.lineTo(0, h); g.closePath(); };
    stick(g, Pt, f.sponge);
    g.save(); Pt(); g.clip();
    let y = h;
    for (const [c, k] of [[f.sponge, .26], [f.cream, .1], [f.sponge, .22], [f.cream, .1], [f.sponge, .5]]) {
      const hh = k * h; g.fillStyle = c; g.fillRect(-5, y - hh, w + 10, hh + 1);
      if (c === f.sponge) spongeDots(g, 0, y - hh, w, hh);
      y -= hh;
    }
    g.fillStyle = f.frost; g.fillRect(w - w * .07, 0, w * .07 + 2, h);
    halftone(g, 0, h * .7, w, h * .3, 'rgba(31,42,107,.35)', 6, 1.8, (u, v) => v);
    g.restore(); ink(g, Pt);
    const F = () => {
      g.beginPath(); g.moveTo(-4, e(0) - 7); g.lineTo(w + 4, -7); g.lineTo(w + 4, h * .08);
      const N = 7;
      for (let i = N; i > 0; i--) { const x0 = w * i / N, x1 = w * (i - 1) / N, L = h * (i % 2 ? .2 : .1);
        g.bezierCurveTo(x0 - 4, e(x0) + L + 8, x1 + 4, e(x1) + L + 8, x1, e(x1) + h * .08); }
      g.lineTo(-4, e(0) + h * .08); g.closePath();
    };
    stick(g, F, f.drip); ink(g, F, 2.2);
    sprinkles(g, 12, () => { const x = rand(8, w * .7); return { x, y: e(x) + rand(0, h * .05) }; });
    candle(g, w * .45, e(w * .45) - 3, 9, 44, pick(CANDLE_COL));
    strawberry(g, w * .8, e(w * .8) - 9, 17);
  });
  return withCentroid(s, verts);
}
function spriteCupcake(f) {
  const w = 150, h = 170;
  const verts = [[.04, .45], [.28, .02], [.72, .02], [.96, .45], [.78, 1], [.22, 1]].map(([a, b]) => ({ x: a * w, y: b * h }));
  const s = mk(w, h, .45, g => {
    const Wr = () => { g.beginPath(); g.moveTo(w * .12, h * .52); g.lineTo(w * .88, h * .52); g.lineTo(w * .77, h); g.lineTo(w * .23, h); g.closePath(); };
    stick(g, Wr, f.wrap);
    g.save(); Wr(); g.clip();
    for (let i = 0; i <= 8; i += 2) { const u = i / 8; g.strokeStyle = P.paper; g.lineWidth = 5;
      g.beginPath(); g.moveTo(lerp(w * .12, w * .88, u), h * .5); g.lineTo(lerp(w * .23, w * .77, u), h); g.stroke(); }
    g.restore(); ink(g, Wr);
    const tiers = [[w / 2, h * .5, w * .47, h * .1], [w / 2, h * .37, w * .37, h * .1], [w / 2, h * .25, w * .25, h * .09], [w / 2, h * .15, w * .12, h * .07]];
    for (const t of tiers) {
      const p = () => { g.beginPath(); g.ellipse(t[0], t[1], t[2], t[3], 0, 0, Math.PI * 2); };
      stick(g, p, f.frost);
      g.save(); p(); g.clip(); halftone(g, t[0] - t[2], t[1], t[2] * 2, t[3], 'rgba(31,42,107,.3)', 5, 1.6, (u, v) => v); g.restore();
      ink(g, p, 2.2);
    }
    sprinkles(g, 16, () => { const a = rand(0, 6.28), r = Math.sqrt(Math.random()); return { x: w / 2 + Math.cos(a) * r * w * .36, y: h * .34 + Math.sin(a) * r * h * .16 }; });
    cherry(g, w / 2, h * .06, 13);
  });
  return withCentroid(s, verts);
}
function spriteRound(f) {
  const w = 190, h = 150, ry = h * .14, top = ry;
  return mk(w, h, .55, g => {
    const B = () => { g.beginPath(); g.moveTo(0, top); g.lineTo(0, h - ry); g.ellipse(w / 2, h - ry, w / 2, ry, 0, Math.PI, 0, true); g.lineTo(w, top); g.closePath(); };
    stick(g, B, f.frost);
    g.save(); B(); g.clip();
    halftone(g, 0, 0, w, h, 'rgba(31,42,107,.32)', 6, 2, u => Math.max(0, (u - .6) * 2.5));
    g.fillStyle = f.cream; g.fillRect(0, h * .62, w, h * .06);
    g.restore(); ink(g, B);
    const fr = x => top + ry * Math.sqrt(Math.max(0, 1 - Math.pow((x - w / 2) / (w / 2), 2)));
    const D = () => {
      g.beginPath(); g.moveTo(0, top); const N = 8;
      for (let i = 0; i < N; i++) { const x0 = w * i / N, x1 = w * (i + 1) / N, L = h * (i % 2 ? .28 : .12);
        g.lineTo(x0, fr(x0) + 4); g.bezierCurveTo(x0 + 2, fr(x0) + L + 6, x1 - 2, fr(x1) + L + 6, x1, fr(x1) + 4); }
      g.lineTo(w, top); g.ellipse(w / 2, top, w / 2, ry, 0, 0, Math.PI, true); g.closePath();
    };
    stick(g, D, f.drip); ink(g, D, 2.2);
    for (let i = 0; i < 12; i++) { const x = w * (i + .5) / 12, yb = (h - ry) + ry * Math.sqrt(Math.max(0, 1 - Math.pow((x - w / 2) / (w / 2), 2))) - 5;
      const Pt = () => { g.beginPath(); g.arc(x, yb, 6.5, 0, 7); }; stick(g, Pt, P.paper); ink(g, Pt, 1.4); }
    sprinkles(g, 14, () => ({ x: rand(w * .12, w * .88), y: top + rand(-ry * .6, ry * .6) }));
    candle(g, w * .3, top + 2, 9, 38, pick(CANDLE_COL));
    candle(g, w * .5, top - 3, 9, 44, pick(CANDLE_COL));
    candle(g, w * .7, top + 2, 9, 38, pick(CANDLE_COL));
  });
}
function spriteTall(f) {
  const w = 120, h = 165;
  return mk(w, h, .5, g => {
    const Pt = () => rr(g, 0, 0, w, h, 6);
    stick(g, Pt, f.sponge);
    g.save(); Pt(); g.clip();
    let y = h;

const proc = document.createElement('canvas'), pctx = proc.getContext('2d', { willReadFrequently: true });

function risoVideo() {
  const k = Math.max(W, H) / 440, pw = Math.max(8, Math.round(W / k)), ph = Math.max(8, Math.round(H / k));
  if (proc.width !== pw || proc.height !== ph || !imgB) {

    imgB = lbx.createImageData(pw, ph); imgP = lpx.createImageData(pw, ph); pNoise = new Float32Array(pw * ph);
    for (let j = 0; j < pNoise.length; j++) pNoise[j] = rand(-.07, .07);
    for (let i = 0; i < imgB.data.length; i += 4) { imgB.data[i] = 0; imgB.data[i + 1] = 120; imgB.data[i + 2] = 191; imgP.data[i] = 255; imgP.data[i + 1] = 72; imgP.data[i + 2] = 176; }
  }
  const m = coverMap();
  pctx.setTransform(-1 / k, 0, 0, 1 / k, pw, 0); pctx.drawImage(video, m.ox, m.oy, m.dw, m.dh); pctx.setTransform(1, 0, 0, 1, 0, 0);

  for (let i = 0, j = 0; i < d.length; i += 4, j++) {

    l = clamp((l - .06) / .84, 0, 1) + pNoise[j];

    p[i + 3] = clamp((.92 - l) / .55, 0, 1) * 205;
  }

}

  const k = Math.min(1, dt * 3.5); anchor.x += (cx - anchor.x) * k; anchor.y += (cy - anchor.y) * k;

}
function update(dt) {
  phaseT += dt;

    const { cw, ch, gap } = cardLayout(dt);
    cards.forEach((c, i) => {
      c.x = anchor.x + (i - 1) * (cw + gap); c.y = anchor.y + Math.sin(T * 2 + i * 1.3) * cw * .03;
      c.rot = Math.sin(T * 1.5 + i * 2) * .04;
      const inside = fingers.some(f => Math.abs(f.x - c.x) < cw / 2 && Math.abs(f.y - c.y) < ch / 2);
      c.hover = lerp(c.hover, inside ? 1 : 0, Math.min(1, dt * 10));
      if (inside) { if (c.hold === 0) SFX.press(); c.hold += dt; } else c.hold = Math.max(0, c.hold - dt * 2);
    });
    const sel = cards.find(c => c.hold >= HOLD);
    if (sel && phaseT > .6) selectCard(sel);
  } else if (phase === 'flip' || phase === 'effect') {
    for (const o of cards) if (o.gone) { o.x += o.vx * dt; o.y += o.vy * dt; o.vy += 1400 * dt; o.rot += dt * 4 * Math.sign(o.vx); o.alpha = Math.max(0, o.alpha - dt * 1.5); }
    if (flip) {
      const t = phaseT, F = flip;
      const pm = easeInOut(clamp(t / .45, 0, 1));
      F.c.x = lerp(F.fx, W / 2, pm); F.c.y = lerp(F.fy, H / 2, pm); F.scale = 1 + pm * .35;
      F.angle = easeInOut(clamp((t - .45) / .6, 0, 1)) * Math.PI;
      if (t > 1.05 && !F.started) { F.started = true; startEffect(F.c.type); burstSparks(W / 2, H / 2, 60, 1.6); }
      if (t > 2.1) { const q = clamp((t - 2.1) / .4, 0, 1); F.scale = 1.35 + q * .6; F.c.alpha = 1 - q; }
      if (t > 2.6) flip = null;

let stepAcc = 0;
function updEffect(dt) {
  const e = effect; e.t += dt;
  if (e.type === 'cake') {
    const rate = e.t < 4 ? 7 : 1.3; e.acc += dt * rate; while (e.acc > 1) { e.acc--; spawnCake(); } killOld('cake', 75);
    if (Math.random() < dt * 22) confetti(rand(0, W), -20, 1, Math.PI / 2, .3, 60);
    if (Math.random() < dt * 1.3) balloon();
    if (e.t > e.next) { e.next = e.t + rand(3.5, 5); if (e.t > 1) poppers(); }
  } else if (e.type === 'snack') {
    const rate = e.t < 4 ? 6 : 1.2; e.acc += dt * rate; while (e.acc > 1) { e.acc--; spawnSnack(); } killOld('snack', 60);
    if (Math.random() < dt * 12) particles.push({ k: 'glit', x: rand(0, W), y: -10, vx: 0, vy: rand(60, 140), r: rand(3, 7), life: 12, t: 0, seed: rand(0, 9), c: pick(INKS) });
  } else if (e.type === 'money') {
    const rate = e.t < 5 ? 14 : 4; e.acc += dt * rate; while (e.acc > 1) { e.acc--; spawnBill(); } killOld('bill', 150);
    updSlot(slot, dt);
  }
  stepAcc += dt; let n = 0;
  while (stepAcc >= 1 / 60 && n < 3) {
    if (e.type === 'money') for (const it of items) if (!it.b.isStatic && !it.removed) {
      const m = it.b.mass, sp = Math.hypot(it.b.velocity.x, it.b.velocity.y);
      if (sp > .5) Body.applyForce(it.b, it.b.position, { x: Math.sin(T * 3 + it.seed) * m * .00025, y: -m * .00012 * Math.min(1, sp / 6) });
      Body.setAngularVelocity(it.b, it.b.angularVelocity + Math.sin(T * 5 + it.seed) * .004);
    }

  if (n === 3) stepAcc = 0;
  for (const it of items) {
    if (it.dying) it.dying += dt;
    const p = it.b.position;
    if (p.y > H + 400 || p.x < -500 || p.x > W + 500) it.dying = Math.max(it.dying, .5);
  }
  items = items.filter(it => { if (it.dying >= .5) { if (!it.removed) Composite.remove(world, it.b); return false; } return true; });
}

// ---------- render ----------
function drawBackground() {
  if (DEMO || video.readyState < 2) {
    ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = P.blueT;
    for (let y = 0; y < H; y += 14) for (let x = (Math.round(y / 14) % 2) * 7; x < W; x += 14) { const r = clamp((y / H - .45) * 4, 0, 2.2); if (r > .2) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } }
    ctx.restore();
    return;
  }
  risoVideo();
}
function drawMannequin() {
  ctx.save(); ctx.lineJoin = 'round';
  for (const n of ['armUL', 'armLL', 'armUR', 'armLR', 'torso', 'neck', 'head']) {
    const b = parts[n]; if (b.position.x < -1000) continue;
    const path = (dx = 0, dy = 0) => { ctx.beginPath(); b.vertices.forEach((v, i) => i ? ctx.lineTo(v.x + dx, v.y + dy) : ctx.moveTo(v.x + dx, v.y + dy)); ctx.closePath(); };
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = n === 'head' || n === 'neck' ? P.pinkT : P.blueT; path(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = INK; ctx.lineWidth = 2; path(2, 1.5); ctx.stroke();
  }
  if (BODY.vis) { const { hc, rx } = BODY; ctx.fillStyle = INK; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(hc.x + s * rx * .35, hc.y, rx * .08, 0, 7); ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(hc.x, hc.y + rx * .2, rx * .3, .3, Math.PI - .3); ctx.stroke();
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = P.pink; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(hc.x + s * rx * .6, hc.y + rx * .25, rx * .14, rx * .08, 0, 0, 7); ctx.fill(); } }
  ctx.restore();
}
function drawDebug() {
  ctx.save(); ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2;
  for (const n of PART_NAMES) { const b = parts[n]; ctx.beginPath(); b.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y)); ctx.closePath(); ctx.stroke(); }
  ctx.restore();
}
function drawSprite(v, x, y, ang, s, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.drawImage(v.cv, -v.ox - v.pad, -v.oy - v.pad, v.w + 2 * v.pad, v.h + 2 * v.pad); ctx.restore();
}
function drawItems() {
  for (const it of items) { if (it.removed) continue; drawSprite(it.v, it.b.position.x, it.b.position.y, it.b.angle, it.s, it.dying ? clamp(1 - it.dying / .5, 0, 1) : 1); }
  for (const a of attached) {
    const f = frames[a.part]; if (!f || !f.vis) continue;
    const c = Math.cos(f.ang), s = Math.sin(f.ang), lx = a.lx * f.sc, ly = a.ly * f.sc;
    const pop = clamp((T - a.born) / .2, 0, 1);
    drawSprite(a.v, f.x + lx * c - ly * s, f.y + lx * s + ly * c, f.ang + a.la, a.s * (1 + (1 - pop) * .3));
  }
}
function drawBunting() {
  const cols = INKS;
  for (let row = 0; row < 2; row++) {
    const n = Math.max(8, Math.round(W / 60)), sag = H * (.05 + row * .03), y0 = row * 14 - 4, fl = Math.min(W, H) * .045;
    const Y = u => y0 + sag * (1 - Math.pow(2 * u - 1, 2)) + Math.sin(T * 2 + u * 6 + row) * 3;
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.beginPath(); for (let i = 0; i <= 40; i++) { const u = i / 40; ctx.lineTo(-10 + u * (W + 20), Y(u)); } ctx.stroke();
    for (let i = 0; i < n; i++) { const u = (i + .5 + row * .5) / (n + row * .5), x = -10 + u * (W + 20), y = Y(u), sw = Math.sin(T * 3 + i) * .12;
      ctx.save(); ctx.translate(x, y); ctx.rotate(sw); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = cols[(i + row) % cols.length];
      ctx.beginPath(); ctx.moveTo(-fl * .45, 0); ctx.lineTo(fl * .45, 0); ctx.lineTo(0, fl); ctx.closePath(); ctx.fill(); ctx.restore(); }
  }
}
function drawCard(c, sprite, sc, flipX = 1, glow = 0, alpha = 1) {
  const cw = CARD.w, ch = CARD.h;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(c.x, c.y); ctx.rotate(c.rot || 0);
  const press = clamp(c.hold / HOLD, 0, 1);
  const sx = sc * (1 + c.hover * .06 + press * .05) * flipX, sy = sc * (1 + c.hover * .06 - press * .14);
  if (press > 0) ctx.translate(Math.sin(T * 60) * press * 3, press * cw * .05);
  ctx.scale(sx, sy);
  if (glow > .01) { ctx.save(); ctx.globalAlpha = alpha * glow; ctx.globalCompositeOperation = 'multiply'; rr(ctx, -cw / 2 - 12, -ch / 2 - 12, cw + 24, ch + 24, cw * .12); ctx.fillStyle = P.yellow; ctx.fill(); ctx.restore(); }
  ctx.drawImage(sprite.cv, -sprite.w / 2 - sprite.pad, -sprite.h / 2 - sprite.pad, sprite.w + 2 * sprite.pad, sprite.h + 2 * sprite.pad);

function drawCards() {
  if (phase === 'cards') {
    cards.forEach((c, i) => { const intro = easeOutBack(clamp((phaseT - i * .12) / .5, 0, 1)); if (intro <= 0) return; drawCard(c, cardBack, intro, 1, c.hover); });
    for (const c of cards) if (c.hold > 0) {
      const f = fingers.find(f => Math.abs(f.x - c.x) < CARD.w / 2 && Math.abs(f.y - c.y) < CARD.h / 2) || { x: c.x, y: c.y };

      ctx.fillStyle = P.paper; ctx.beginPath(); ctx.arc(f.x, f.y, 34, 0, 7); ctx.fill();
      ctx.lineWidth = 8; ctx.strokeStyle = P.pink; ctx.beginPath(); ctx.arc(f.x, f.y, 30, -Math.PI / 2, -Math.PI / 2 + p * 6.283); ctx.stroke();

function render() {

  if (e && e.type === 'cake') drawParticles(p => p.k === 'balloon');
  drawItems();
  if (e && e.type === 'cake') drawBunting();
  drawParticles(p => p.k !== 'balloon');
  if (e) {
    if (e.type === 'cake' && ribbon) drawRibbon(e.t);
    if (e.type === 'snack' && glitter) drawGlitter(e.t);
    if (e.type === 'money' && slot) drawSlot(slot);
  }
  drawCards();
  drawFingers();
  if (paperPat) { ctx.fillStyle = paperPat; ctx.fillRect(0, 0, W, H); }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (phase !== 'start') {
    track(now);
    updateBody(now);
    update(dt);
    render();
  }
  requestAnimationFrame(frame);
}

// ---------- boot ----------
const go = document.getElementById('go'), statusEl = document.getElementById('status'), startEl = document.getElementById('start');
cvs.addEventListener('pointerdown', e => { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('pointerup', () => { mouse.down = false; });
addEventListener('pointercancel', () => { mouse.down = false; });
addEventListener('resize', resize);
againBtn.addEventListener('click', e => { e.stopPropagation(); startCards(); });

resize();
buildPaper();
initPhysics();
const fontsP = Promise.all(['Archivo Black', 'Bungee', 'Chewy', 'Pacifico', 'Shrikhand', 'Space Mono'].map(f => document.fonts.load(`40px "${f}"`))).catch(() => {});
const modelP = loadModels().catch(e => { console.error(e); return 'fail'; });
fontsP.then(() => { buildSprites(); go.disabled = false; go.textContent = 'Open my gift'; statusEl.textContent = ''; });
requestAnimationFrame(frame);

async function begin(demo) {
  initAudio();
  go.disabled = true;
  if (!demo) {
    if (!window.isSecureContext || !navigator.mediaDevices) { statusEl.textContent = 'The camera needs a secure page (https or localhost).'; go.disabled = false; return; }
    statusEl.textContent = 'Turning on the camera…';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream; await video.play();
    } catch (e) {
      console.warn(e); statusEl.textContent = 'Camera unavailable. Allow camera access in Chrome, or try the preview below.'; go.disabled = false; return;
    }
    statusEl.textContent = 'Warming up the AR engine…';

    if (r === 'fail') { statusEl.textContent = 'Could not load the AR models. Check your connection and reload.'; go.disabled = false; return; }

}
window.__ar = { get modelsReady() { return modelsReady; }, get cards() { return cards; }, selectCard, get items() { return items.length; }, get attached() { return attached.length; } };
go.addEventListener('click', () => begin(DEMO));
document.getElementById('demoLink').addEventListener('click', () => begin(true));
</script>
